name: Deploy demo to GitHub Pages

# Free, no backend, no extra accounts. One-time setup: repo Settings -> Pages ->
# Source: "GitHub Actions". The page serves the pre-analyzed examples in demo/;
# analyzing your own repository is done locally (see the README).

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "demo/**"
      - "scripts/export_static_demo.py"
      - "parser/pipeline/migration_plan.py"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_STATIC_DEMO: "1"
      VITE_BASE: /ReArch/
    steps:
      - uses: actions/checkout@v4
      - name: Export the bundled analyses as static files
        run: python3 scripts/export_static_demo.py web/public/demo
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
