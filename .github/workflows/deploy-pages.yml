name: Deploy UI to GitHub Pages

# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions", and add the
# repository variable API_BASE (Settings -> Secrets and variables -> Actions ->
# Variables) set to the Space URL, e.g. https://varunb1996-rearch-api.hf.space

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Skipped (not failed) until the API_BASE variable exists.
    if: ${{ vars.API_BASE != '' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      VITE_API_BASE: ${{ vars.API_BASE }}
      VITE_BASE: /ReArch/
    steps:
      - uses: actions/checkout@v4
      - name: Check configuration
        run: |
          if [ -z "$VITE_API_BASE" ]; then
            echo "::error::Set the API_BASE repository variable to the backend URL (see the comment at the top of this workflow)."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
